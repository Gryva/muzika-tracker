<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎵 Muzika Tracker</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface-2: #24242b;
      --text: #e8e8ec;
      --text-2: #a0a0a8;
      --accent: #ff6b6b;
      --accent-2: #4ecdc4;
      --accent-3: #ffe66d;
      --accent-4: #a78bfa;
      --accent-5: #f093fb;
      --danger: #ff4757;
      --success: #2ed573;
      --warning: #ffa502;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --transition: 0.2s ease;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,17,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--surface-2);
      padding: 12px 16px;
    }
    .header-inner {
      max-width: 900px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap;
    }
    .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }
    .header-spacer { flex: 1; }
    .btn {
      padding: 9px 16px; border: none; border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition); font-family: inherit;
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-ghost { background: transparent; border: 1px solid var(--surface-2); }
    .btn-sm { padding: 7px 12px; font-size: 12px; }
    .btn-icon { padding: 8px; border-radius: 50%; }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px; padding: 12px 16px 0;
      max-width: 900px; margin: 0 auto;
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 10px 18px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: transparent; color: var(--text-2); font-weight: 600; font-size: 14px;
      cursor: pointer; white-space: nowrap; border: none; font-family: inherit;
      transition: var(--transition); position: relative;
    }
    .tab.active { color: var(--text); background: var(--surface); }
    .tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
      height: 2px; background: var(--accent); border-radius: 2px;
    }
    .tab-badge {
      display: inline-block; margin-left: 5px; padding: 2px 6px;
      background: var(--surface-2); border-radius: 10px;
      font-size: 11px; color: var(--text-2); min-width: 18px; text-align: center;
    }

    /* Main content */
    .container {
      max-width: 900px; margin: 0 auto; padding: 16px;
    }

    /* Filters bar */
    .filters {
      display: flex; gap: 8px; margin-bottom: 16px;
      flex-wrap: wrap; align-items: center;
    }
    .search-input {
      flex: 1; min-width: 180px; padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--surface-2);
      border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
      font-family: inherit; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Album list */
    .album-list { display: flex; flex-direction: column; gap: 10px; }

    /* Album card */
    .album-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid transparent;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .album-card:hover { border-color: var(--surface-2); }
    .album-card.own { border-left: 3px solid var(--accent); }

    .album-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .album-title-group { flex: 1; min-width: 0; }
    .album-artist {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--accent); margin-bottom: 2px;
    }
    .album-name {
      font-size: 17px; font-weight: 700; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis;
    }
    .album-meta {
      display: flex; align-items: center; gap: 8px; margin-top: 6px;
      flex-wrap: wrap;
    }
    .album-year {
      font-size: 11px; color: var(--text-2); background: var(--surface-2);
      padding: 3px 8px; border-radius: 6px;
    }
    .album-date { font-size: 12px; color: var(--text-2); }
    .album-rating { font-size: 13px; font-weight: 800; }
    .rating-5 { color: var(--success); }
    .rating-4 { color: var(--accent-2); }
    .rating-3 { color: var(--accent-3); }
    .rating-2 { color: var(--warning); }
    .rating-1 { color: var(--danger); }

    .album-body { margin-top: 10px; }
    .album-impression {
      font-size: 14px; color: var(--text-2); line-height: 1.5; font-style: italic;
    }
    .album-tracks {
      margin-top: 8px; font-size: 13px; color: var(--text-2);
    }
    .album-tracks strong { color: var(--accent-3); }
    .album-recommend {
      margin-top: 8px; display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
    }
    .rec-yes { background: rgba(46,213,115,0.15); color: var(--success); }
    .rec-no { background: rgba(255,71,87,0.15); color: var(--danger); }
    .rec-meh { background: rgba(255,165,2,0.15); color: var(--warning); }
    .album-comments {
      margin-top: 8px; font-size: 13px; color: var(--text-2);
      padding: 8px 12px; background: var(--surface-2); border-radius: var(--radius-sm);
    }
    .album-owner {
      margin-top: 10px; font-size: 11px; color: var(--text-2);
      text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    }
    .album-actions {
      display: flex; gap: 6px; margin-top: 12px; opacity: 0.7;
    }
    .album-card:hover .album-actions { opacity: 1; }

    /* Empty state */
    .empty {
      text-align: center; padding: 60px 20px; color: var(--text-2);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Modal overlay */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 200; display: none; align-items: flex-end; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.active { display: flex; }
    .sheet {
      background: var(--surface);
      width: 100%; max-width: 560px; max-height: 92vh;
      border-radius: var(--radius) var(--radius) 0 0;
      overflow-y: auto; animation: slideUp 0.25s ease;
      border-top: 1px solid var(--surface-2);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-header {
      padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; background: var(--surface); z-index: 2;
    }
    .sheet-title { font-size: 20px; font-weight: 800; }
    .sheet-body { padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-2); margin-bottom: 6px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--surface-2);
      border-radius: var(--radius-sm); color: var(--text); font-size: 15px;
      font-family: inherit; outline: none; transition: var(--transition);
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
    .form-textarea { min-height: 72px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    .form-actions {
      display: flex; gap: 10px; justify-content: flex-end; padding-top: 4px;
      position: sticky; bottom: 0; background: var(--surface); padding-bottom: 8px;
    }
    .form-actions .btn { padding: 12px 22px; }

    /* User picker */
    .user-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
      background: var(--surface-2); cursor: pointer; transition: var(--transition);
    }
    .user-chip.active { background: var(--accent); color: #000; }

    /* Settings */
    .color-option {
      width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: var(--transition);
    }
    .color-option.active { border-color: #fff; transform: scale(1.15); }
    .color-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

    .view-option {
      padding: 10px 14px; border-radius: var(--radius-sm);
      background: var(--bg); border: 2px solid transparent;
      cursor: pointer; font-size: 13px; font-weight: 600; text-align: center;
    }
    .view-option.active { border-color: var(--accent); }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .settings-grid { grid-template-columns: 1fr; } }

    /* Compact view */
    .view-compact .album-card { padding: 12px 14px; }
    .view-compact .album-name { font-size: 15px; }
    .view-compact .album-impression,
    .view-compact .album-tracks,
    .view-compact .album-comments,
    .view-compact .album-actions { display: none; }
    .view-compact .album-meta { margin-top: 4px; }

    /* Table view */
    .view-table .album-list { display: table; width: 100%; border-collapse: collapse; }
    .view-table .album-card {
      display: table-row; padding: 0; border-radius: 0;
      border-bottom: 1px solid var(--surface-2);
    }
    .view-table .album-card > * { display: none; }
    .view-table .album-card::before {
      content: attr(data-artist) " — " attr(data-album);
      display: table-cell; padding: 10px 8px; font-size: 14px;
    }
    .view-table .album-card::after {
      content: attr(data-rating);
      display: table-cell; padding: 10px 8px; text-align: right;
    }

    /* Spinner */
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--surface-2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 1s linear infinite; margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--surface-2); color: var(--text); padding: 12px 20px;
      border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
      z-index: 300; opacity: 0; transition: 0.3s ease; pointer-events: none;
      box-shadow: var(--shadow); white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Login overlay */
    .login-overlay {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 400; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
    }
    .login-box {
      background: var(--surface); padding: 32px; border-radius: var(--radius);
      width: 90%; max-width: 380px; text-align: center;
      border: 1px solid var(--surface-2);
    }
    .login-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .login-sub { color: var(--text-2); font-size: 14px; margin-bottom: 24px; }
    .user-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .user-btn {
      padding: 16px; border-radius: var(--radius-sm);
      background: var(--bg); border: 2px solid var(--surface-2);
      color: var(--text); font-size: 16px; font-weight: 700;
      cursor: pointer; transition: var(--transition); font-family: inherit;
    }
    .user-btn:hover { border-color: var(--accent); }
    .user-btn.selected { border-color: var(--accent); background: rgba(255,107,107,0.1); }
    .guest-btn {
      margin-top: 16px; width: 100%; padding: 14px;
      background: transparent; border: 1px dashed var(--text-2);
      color: var(--text-2); border-radius: var(--radius-sm);
      cursor: pointer; font-family: inherit; font-size: 14px;
    }

    /* Import area */
    .import-hint {
      font-size: 12px; color: var(--text-2); margin-top: 8px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-2); }

    .hide { display: none !important; }
  </style>
</head>
<body>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  // ═══════════════════════════════════════════════
  // CONFIG: Replace with your Firebase project values
  // ═══════════════════════════════════════════════
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const albumsRef = collection(db, "albums");

  // ═══════════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════════
  const USERS = ["Hela", "Karlo", "Lea", "Lovro", "Lucija"];
  const DEFAULT_SETTINGS = {
    view: "card",
    theme: "default",
    font: "system",
    showOthers: true
  };

  let state = {
    user: null,
    albums: [],
    activeTab: "all",
    settings: { ...DEFAULT_SETTINGS },
    editingId: null,
    search: "",
    loading: true,
    firebaseReady: false
  };

  const THEMES = {
    default: { accent: "#ff6b6b", accent2: "#4ecdc4", accent3: "#ffe66d", accent4: "#a78bfa", accent5: "#f093fb" },
    ocean:   { accent: "#4dabf7", accent2: "#38d9a9", accent3: "#ffd43b", accent4: "#9775fa", accent5: "#f783ac" },
    forest:  { accent: "#69db7c", accent2: "#3bc9db", accent3: "#fcc419", accent4: "#da77f2", accent5: "#ff922b" },
    sunset:  { accent: "#ff922b", accent2: "#ff6b6b", accent3: "#f06595", accent4: "#cc5de8", accent5: "#845ef7" },
    berry:   { accent: "#f06595", accent2: "#cc5de8", accent3: "#ff922b", accent4: "#51cf66", accent5: "#339af0" }
  };
  const FONTS = {
    system: "'Segoe UI', system-ui, -apple-system, sans-serif",
    mono: "'SF Mono', 'Fira Code', 'Cascadia Code', monospace",
    rounded: "'Nunito', 'Quicksand', 'Varela Round', 'Segoe UI', sans-serif"
  };

  // ═══════════════════════════════════════════════
  // PERSISTENCE
  // ═══════════════════════════════════════════════
  function loadSettings() { try { const r=localStorage.getItem("muzika_settings_v1"); if(r) state.settings={...DEFAULT_SETTINGS,...JSON.parse(r)}; }catch(e){} }
  function saveSettings() { localStorage.setItem("muzika_settings_v1", JSON.stringify(state.settings)); }
  function loadUser() { state.user = localStorage.getItem("muzika_user"); }
  function saveUser(u) { state.user=u; localStorage.setItem("muzika_user", u||""); }

  function applyTheme() {
    const t = THEMES[state.settings.theme] || THEMES.default;
    const r = document.documentElement;
    r.style.setProperty("--accent", t.accent);
    r.style.setProperty("--accent-2", t.accent2);
    r.style.setProperty("--accent-3", t.accent3);
    r.style.setProperty("--accent-4", t.accent4);
    r.style.setProperty("--accent-5", t.accent5);
    r.style.setProperty("--font", FONTS[state.settings.font] || FONTS.system);
    document.body.className = `view-${state.settings.view}`;
  }

  // ═══════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════
  function fmtDate(d) {
    if(!d) return "";
    if(typeof d==="string") d=new Date(d);
    if(!(d instanceof Date)||isNaN(d)) return "";
    return d.toLocaleDateString("hr-HR", {day:"numeric", month:"short"});
  }
  function esc(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function rtClass(r) { const n=parseFloat(r); if(n>=5)return"rating-5"; if(n>=4)return"rating-4"; if(n>=3)return"rating-3"; if(n>=2)return"rating-2"; return"rating-1"; }
  function recClass(r) { const s=(r||"").toLowerCase().trim(); if(s.startsWith("da")||s==="yes"||s==="da!")return"rec-yes"; if(s.startsWith("ne")||s==="no")return"rec-no"; return"rec-meh"; }
  function recIcon(r) { const s=(r||"").toLowerCase().trim(); if(s.startsWith("da")||s==="yes"||s==="da!")return"✅"; if(s.startsWith("ne")||s==="no")return"❌"; return"🤷"; }

  // ═══════════════════════════════════════════════
  // RENDER LOGIN
  // ═══════════════════════════════════════════════
  function renderLogin() {
    const ex = document.querySelector(".login-overlay");
    if(ex) ex.remove();
    const el = document.createElement("div");
    el.className = "login-overlay";
    el.innerHTML = `
      <div class="login-box">
        <div class="login-title">🎵 Muzika Tracker</div>
        <div class="login-sub">Who's listening?</div>
        <div class="user-grid">
          ${USERS.map(u=>`<button class="user-btn" data-user="${u}">${u}</button>`).join("")}
        </div>
        <button class="guest-btn" data-user="">👀 View Only</button>
      </div>`;
    document.body.appendChild(el);
    el.querySelectorAll(".user-btn,.guest-btn").forEach(b=>{
      b.addEventListener("click",()=>{ saveUser(b.dataset.user); el.remove(); initApp(); });
    });
  }

  // ═══════════════════════════════════════════════
  // RENDER HEADER + TABS + LIST
  // ═══════════════════════════════════════════════
  function renderHeader() {
    let h = document.querySelector(".header");
    if(!h){ h=document.createElement("div"); h.className="header"; document.body.appendChild(h); }
    h.innerHTML = `
      <div class="header-inner">
        <div class="logo">🎵 Muzika</div>
        <div class="header-spacer"></div>
        ${state.user?`<span class="user-chip active">${state.user}</span>`:""}
        <button class="btn btn-ghost btn-sm" id="btn-export" title="Export to Excel">📥</button>
        <button class="btn btn-ghost btn-sm" id="btn-import" title="Import from Excel">📤</button>
        <button class="btn btn-ghost btn-sm" id="btn-settings">⚙️</button>
        <button class="btn btn-primary btn-sm" id="btn-add">＋ Add</button>
      </div>`;
    h.querySelector("#btn-add").addEventListener("click",()=>openSheet());
    h.querySelector("#btn-settings").addEventListener("click",()=>openSettings());
    h.querySelector("#btn-export").addEventListener("click",()=>exportToExcel());
    h.querySelector("#btn-import").addEventListener("click",()=>importFromExcel());
  }

  function renderTabs() {
    let t = document.querySelector(".tabs");
    if(!t){ t=document.createElement("div"); t.className="tabs"; document.body.appendChild(t); }
    const counts={}; USERS.forEach(u=>counts[u]=state.albums.filter(a=>a.owner===u).length);
    t.innerHTML = `
      <button class="tab ${state.activeTab==='all'?'active':''}" data-tab="all">All<span class="tab-badge">${state.albums.length}</span></button>
      ${USERS.map(u=>`<button class="tab ${state.activeTab===u?'active':''}" data-tab="${u}">${u}<span class="tab-badge">${counts[u]||0}</span></button>`).join("")}`;
    t.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ state.activeTab=b.dataset.tab; renderTabs(); renderList(); }));
  }

  function renderList() {
    let c = document.querySelector(".container");
    if(!c){ c=document.createElement("div"); c.className="container"; document.body.appendChild(c); }
    let list = c.querySelector(".album-list");
    if(!list){
      c.innerHTML = `
        <div class="filters">
          <input type="text" class="search-input" placeholder="🔍 Search artist, album, genre..." id="search-input">
          <div class="filter-group">
            <button class="btn btn-ghost btn-sm" id="btn-toggle">${state.settings.showOthers?"👁️ All":"🙈 Mine"}</button>
          </div>
        </div>
        <div class="album-list"></div>`;
      c.querySelector("#search-input").addEventListener("input",e=>{ state.search=e.target.value.toLowerCase(); renderList(); });
      c.querySelector("#btn-toggle").addEventListener("click",()=>{ state.settings.showOthers=!state.settings.showOthers; saveSettings(); renderList(); });
      list = c.querySelector(".album-list");
    }
    const s = state.search;
    let filtered = state.albums.filter(a=>{
      if(state.activeTab!=="all" && a.owner!==state.activeTab) return false;
      if(!state.settings.showOthers && a.owner!==state.user) return false;
      if(!s) return true;
      return `${a.artist} ${a.album} ${a.genre} ${a.impression} ${a.owner}`.toLowerCase().includes(s);
    });
    filtered.sort((a,b)=> (b.dateAdded?.seconds||0) - (a.dateAdded?.seconds||0));

    const btnToggle = document.getElementById("btn-toggle");
    if(btnToggle) btnToggle.textContent = state.settings.showOthers ? "👁️ All" : "🙈 Mine";

    if(state.loading){ list.innerHTML=`<div class="spinner"></div>`; return; }
    if(!state.firebaseReady){ list.innerHTML=`<div class="empty"><div class="empty-icon">🔥</div><div>Check Firebase config in the code.<br>See README.md for setup.</div></div>`; return; }
    if(filtered.length===0){ list.innerHTML=`<div class="empty"><div class="empty-icon">🎧</div><div>${s?"No matches":"No albums yet. Tap ＋ Add!"}</div></div>`; return; }

    list.innerHTML = filtered.map(a=>`
      <div class="album-card ${a.owner===state.user?'own':''}" data-id="${a.id}" data-artist="${esc(a.artist)}" data-album="${esc(a.album)}" data-rating="${esc(a.rating)}">
        <div class="album-header">
          <div class="album-title-group">
            <div class="album-artist">${esc(a.artist)}</div>
            <div class="album-name">${esc(a.album)}</div>
            <div class="album-meta">
              ${a.year?`<span class="album-year">${esc(a.year)}</span>`:""}
              ${a.listenedDate?`<span class="album-date">📅 ${fmtDate(a.listenedDate)}</span>`:""}
              ${a.genre?`<span class="album-date">${esc(a.genre)}</span>`:""}
              ${a.rating?`<span class="album-rating ${rtClass(a.rating)}">★ ${esc(a.rating)}</span>`:""}
            </div>
          </div>
        </div>
        <div class="album-body">
          ${a.impression?`<div class="album-impression">"${esc(a.impression)}"</div>`:""}
          ${a.standoutTracks?`<div class="album-tracks"><strong>🎵</strong> ${esc(a.standoutTracks)}</div>`:""}
          ${a.recommend?`<span class="album-recommend ${recClass(a.recommend)}">${recIcon(a.recommend)} ${esc(a.recommend)}</span>`:""}
          ${a.comments?`<div class="album-comments">💬 ${esc(a.comments)}</div>`:""}
          <div class="album-owner">${esc(a.owner)}'s pick</div>
        </div>
        ${a.owner===state.user?`
          <div class="album-actions">
            <button class="btn btn-ghost btn-sm btn-edit" data-id="${a.id}">✏️ Edit</button>
            <button class="btn btn-ghost btn-sm btn-delete" data-id="${a.id}" style="color:var(--danger)">🗑️</button>
          </div>`:""}
      </div>`).join("");

    list.querySelectorAll(".btn-edit").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.id)));
    list.querySelectorAll(".btn-delete").forEach(b=>b.addEventListener("click",async()=>{
      if(!confirm("Delete this album?")) return;
      try{ await deleteDoc(doc(db,"albums",b.dataset.id)); toast("Deleted ✂️"); }
      catch(e){ toast("Error 😢"); }
    }));
  }

  // ═══════════════════════════════════════════════
  // ADD / EDIT SHEET
  // ═══════════════════════════════════════════════
  function openSheet(id=null) {
    state.editingId=id;
    const a = id ? state.albums.find(x=>x.id===id) : null;
    const ov = document.createElement("div");
    ov.className="overlay active"; ov.id="sheet-overlay";
    const dateVal = a?.listenedDate ? (typeof a.listenedDate==="string"?a.listenedDate:new Date(a.listenedDate).toISOString().split("T")[0]) : "";
    ov.innerHTML = `
      <div class="sheet">
        <div class="sheet-header">
          <div class="sheet-title">${id?"✏️ Edit Album":"＋ Add Album"}</div>
          <button class="btn btn-ghost btn-icon" id="sh-close">✕</button>
        </div>
        <div class="sheet-body">
          <div class="form-group"><label class="form-label">Artist</label><input class="form-input" id="f-artist" value="${esc(a?.artist||"" )}" placeholder="e.g. Pink Floyd"></div>
          <div class="form-group"><label class="form-label">Album</label><input class="form-input" id="f-album" value="${esc(a?.album||"" )}" placeholder="e.g. Animals"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Year</label><input class="form-input" id="f-year" value="${esc(a?.year||"" )}" placeholder="1977"></div>
            <div class="form-group"><label class="form-label">Genre</label><input class="form-input" id="f-genre" value="${esc(a?.genre||"" )}" placeholder="Progressive rock"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Date Listened</label><input type="date" class="form-input" id="f-date" value="${dateVal}"></div>
            <div class="form-group"><label class="form-label">Rating (1-5)</label><input class="form-input" id="f-rating" value="${esc(a?.rating||"" )}" placeholder="5, 4.5, 5+"></div>
          </div>
          <div class="form-group"><label class="form-label">Impression / Review</label><textarea class="form-textarea" id="f-impression" placeholder="How did it make you feel?">${esc(a?.impression||"" )}</textarea></div>
          <div class="form-group"><label class="form-label">Standout Tracks</label><input class="form-input" id="f-tracks" value="${esc(a?.standoutTracks||"" )}" placeholder="Dogs, Pigs, Sheep"></div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Recommend</label>
              <select class="form-select" id="f-recommend">
                <option value="" ${!a?.recommend?"selected":""}>—</option>
                <option value="Da" ${a?.recommend==="Da"?"selected":""}>✅ Da</option>
                <option value="Ne" ${a?.recommend==="Ne"?"selected":""}>❌ Ne</option>
                <option value="Meh" ${a?.recommend==="Meh"?"selected":""}>🤷 Meh</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Owner</label>
              <select class="form-select" id="f-owner">
                ${USERS.map(u=>`<option value="${u}" ${(a?.owner||state.user)===u?"selected":""}>${u}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="form-group"><label class="form-label">Comments</label><textarea class="form-textarea" id="f-comments" placeholder="Anything else?">${esc(a?.comments||"" )}</textarea></div>
          <div class="form-actions">
            <button class="btn btn-ghost" id="sh-cancel">Cancel</button>
            <button class="btn btn-primary" id="sh-save">${id?"Save Changes":"Add Album"}</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const close=()=>ov.remove();
    ov.querySelector("#sh-close").addEventListener("click",close);
    ov.querySelector("#sh-cancel").addEventListener("click",close);
    ov.addEventListener("click",e=>{if(e.target===ov)close();});
    ov.querySelector("#sh-save").addEventListener("click",async()=>{
      const data={
        artist: document.getElementById("f-artist").value.trim(),
        album: document.getElementById("f-album").value.trim(),
        year: document.getElementById("f-year").value.trim(),
        genre: document.getElementById("f-genre").value.trim(),
        listenedDate: document.getElementById("f-date").value||null,
        rating: document.getElementById("f-rating").value.trim(),
        impression: document.getElementById("f-impression").value.trim(),
        standoutTracks: document.getElementById("f-tracks").value.trim(),
        recommend: document.getElementById("f-recommend").value,
        owner: document.getElementById("f-owner").value,
        comments: document.getElementById("f-comments").value.trim(),
      };
      if(!data.artist||!data.album){ toast("Artist and Album required!"); return; }
      try{
        if(id){ await updateDoc(doc(db,"albums",id), {...data, updatedAt:serverTimestamp()}); toast("Updated ✏️"); }
        else { await addDoc(albumsRef, {...data, dateAdded:serverTimestamp()}); toast("Added 🎉"); }
        close();
      }catch(err){ console.error(err); toast("Error saving 😢 Check Firebase config."); }
    });
  }

  // ═══════════════════════════════════════════════
  // SETTINGS
  // ═══════════════════════════════════════════════
  function openSettings() {
    const ov=document.createElement("div"); ov.className="overlay active"; ov.id="settings-overlay";
    ov.innerHTML=`
      <div class="sheet">
        <div class="sheet-header">
          <div class="sheet-title">⚙️ Customize</div>
          <button class="btn btn-ghost btn-icon" id="st-close">✕</button>
        </div>
        <div class="sheet-body">
          <div class="form-group">
            <label class="form-label">Theme Color</label>
            <div class="color-row">
              ${Object.entries(THEMES).map(([k,c])=>`<div class="color-option ${state.settings.theme===k?'active':''}" style="background:${c.accent}" data-theme="${k}"></div>`).join("")}
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">View Mode</label>
            <div class="settings-grid">
              <div class="view-option ${state.settings.view==='card'?'active':''}" data-view="card">📋 Card</div>
              <div class="view-option ${state.settings.view==='compact'?'active':''}" data-view="compact">⚡ Compact</div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Font Style</label>
            <div class="settings-grid">
              <div class="view-option ${state.settings.font==='system'?'active':''}" data-font="system">System</div>
              <div class="view-option ${state.settings.font==='mono'?'active':''}" data-font="mono">Mono</div>
              <div class="view-option ${state.settings.font==='rounded'?'active':''}" data-font="rounded">Rounded</div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Account</label>
            <button class="btn btn-ghost" style="width:100%;justify-content:center;" id="btn-logout">🚪 Switch User</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const close=()=>ov.remove();
    ov.querySelector("#st-close").addEventListener("click",close);
    ov.addEventListener("click",e=>{if(e.target===ov)close();});
    ov.querySelectorAll(".color-option").forEach(el=>el.addEventListener("click",()=>{
      state.settings.theme=el.dataset.theme; saveSettings(); applyTheme();
      ov.querySelectorAll(".color-option").forEach(c=>c.classList.remove("active")); el.classList.add("active");
    }));
    ov.querySelectorAll("[data-view]").forEach(el=>el.addEventListener("click",()=>{
      state.settings.view=el.dataset.view; saveSettings(); applyTheme(); renderList();
      ov.querySelectorAll("[data-view]").forEach(c=>c.classList.remove("active")); el.classList.add("active");
    }));
    ov.querySelectorAll("[data-font]").forEach(el=>el.addEventListener("click",()=>{
      state.settings.font=el.dataset.font; saveSettings(); applyTheme();
      ov.querySelectorAll("[data-font]").forEach(c=>c.classList.remove("active")); el.classList.add("active");
    }));
    ov.querySelector("#btn-logout").addEventListener("click",()=>{ saveUser(null); close(); renderLogin(); });
  }

  // ═══════════════════════════════════════════════
  // EXPORT TO EXCEL (client-side via SheetJS)
  // ═══════════════════════════════════════════════
  function exportToExcel() {
    if(!state.albums.length){ toast("Nothing to export"); return; }
    const rows = state.albums.map(a=>({
      Izvođač: a.artist,
      Album: a.album,
      Godina: a.year,
      Žanr: a.genre,
      "Datum Preslušavanja": a.listenedDate || "",
      "Ocjena (1-5)": a.rating,
      "Dojim Albuma": a.impression,
      "Istaknute Pjesme": a.standoutTracks,
      "Preporučam": a.recommend,
      "Komentari": a.comments,
      "Tko": a.owner,
      "Dodano": a.dateAdded? new Date(a.dateAdded.seconds*1000).toISOString() : ""
    }));
    const wb = XLSX.utils.book_new();
    // One sheet per user + "Sve"
    const allWs = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, allWs, "Sve");
    USERS.forEach(u=>{
      const userRows = rows.filter(r=>r.Tko===u);
      if(userRows.length){
        const ws = XLSX.utils.json_to_sheet(userRows);
        XLSX.utils.book_append_sheet(wb, ws, u);
      }
    });
    XLSX.writeFile(wb, `muzika-export-${new Date().toISOString().slice(0,10)}.xlsx`);
    toast("Downloaded Excel 📥");
  }

  // ═══════════════════════════════════════════════
  // IMPORT FROM EXCEL
  // ═══════════════════════════════════════════════
  function importFromExcel() {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".xlsx,.xls,.csv"; inp.style.display="none";
    document.body.appendChild(inp);
    inp.addEventListener("change", async (e)=>{
      const file = e.target.files[0];
      if(!file){ inp.remove(); return; }
      try {
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, {type:"array"});
        let imported = 0;
        const batch = writeBatch(db);
        wb.SheetNames.forEach(name=>{
          const ws = wb.Sheets[name];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1});
          if(!rows.length) return;
          // Try to detect header row
          let headerIdx = 0;
          for(let i=0;i<Math.min(5,rows.length);i++){
            const row = rows[i];
            if(row.some(c=>/izvo|artist|album|godina|year|ocjena|rating|prepor/i.test(String(c)))){ headerIdx=i; break; }
          }
          const headers = rows[headerIdx].map(h=>String(h).toLowerCase().trim());
          const idx = key => headers.findIndex(h=>h.includes(key));
          const artistI = idx("izvo")!==-1? idx("izvo") : idx("artist");
          const albumI = idx("album");
          const yearI = idx("godina")!==-1? idx("godina") : idx("year");
          const genreI = idx("žanr")!==-1? idx("žanr") : idx("genre");
          const dateI = idx("datum")!==-1? idx("datum") : idx("date");
          const ratingI = idx("ocjena")!==-1? idx("ocjena") : idx("rating");
          const impressI = idx("dojim")!==-1? idx("dojim") : idx("impression");
          const tracksI = idx("istak")!==-1? idx("istak") : idx("track");
          const recI = idx("prepor")!==-1? idx("prepor") : idx("recommend");
          const commentI = idx("koment")!==-1? idx("koment") : idx("comment");
          const ownerGuess = USERS.find(u=>name.toLowerCase().includes(u.toLowerCase())) || state.user || "Unknown";

          for(let i=headerIdx+1;i<rows.length;i++){
            const r = rows[i];
            if(!r[artistI] && !r[albumI]) continue;
            const docRef = doc(collection(db,"albums"));
            batch.set(docRef, {
              artist: String(r[artistI]||"").trim(),
              album: String(r[albumI]||"").trim(),
              year: r[yearI]?String(r[yearI]).trim():"",
              genre: r[genreI]?String(r[genreI]).trim():"",
              listenedDate: r[dateI]? String(r[dateI]).trim(): null,
              rating: r[ratingI]?String(r[ratingI]).trim():"",
              impression: r[impressI]?String(r[impressI]).trim():"",
              standoutTracks: r[tracksI]?String(r[tracksI]).trim():"",
              recommend: r[recI]?String(r[recI]).trim():"",
              comments: r[commentI]?String(r[commentI]).trim():"",
              owner: ownerGuess,
              dateAdded: serverTimestamp()
            });
            imported++;
          }
        });
        if(imported>500){ toast("Too many rows (>500). Upload in chunks."); inp.remove(); return; }
        await batch.commit();
        toast(`Imported ${imported} albums 📤`);
      } catch(err){ console.error(err); toast("Import failed 😢"); }
      inp.remove();
    });
    inp.click();
  }

  // ═══════════════════════════════════════════════
  // TOAST
  // ═══════════════════════════════════════════════
  function toast(msg) {
    let t=document.getElementById("toast");
    if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2500);
  }

  // ═══════════════════════════════════════════════
  // FIREBASE LISTENER
  // ═══════════════════════════════════════════════
  function subscribe() {
    const q = query(albumsRef, orderBy("dateAdded","desc"));
    onSnapshot(q, snapshot=>{
      state.albums = snapshot.docs.map(d=>({id:d.id, ...d.data()}));
      state.loading = false; state.firebaseReady = true;
      renderTabs(); renderList();
    }, err=>{
      console.error(err);
      state.loading = false; state.firebaseReady = false;
      renderList();
      toast("Firebase error — check config 🔥");
    });
  }

  // ═══════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════
  function initApp() {
    renderHeader(); renderTabs(); renderList(); subscribe(); applyTheme();
  }

  loadSettings(); loadUser(); applyTheme();
  if(!state.user) renderLogin(); else initApp();

</script>
